name: Daily Polymarket Pull

on:
  schedule:
    - cron: '20 * * * *'      # jede Stunde um :20 UTC
  workflow_dispatch: {}

permissions:
  contents: write

# verhindert, dass zwei Laeufe gleichzeitig pushen
concurrency:
  group: polymarket-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pull script
        run: python3 pull.py
      - name: Commit and push data
        run: |
          git config user.name "polymarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "keine Aenderung" && exit 0
          git commit -m "Data pull $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash
          git push
